[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-finance-tracker"
version = "1.0.0"
description = "微博财经博主追踪与投资辅助分析工具"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "schedule>=1.2.0",
    "jieba>=0.42.1",
    "snownlp>=0.12.3",
    "matplotlib>=3.7.0",
    "sqlite-utils>=3.35",
]

[project.scripts]
wft = "src.main:cli"
